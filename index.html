<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>웹밴드 스튜디오</title>
    <meta name="description" content="비트와 멜로디를 만들고, 녹음하고, 음악을 배우는 브라우저 스튜디오입니다." />
    <meta name="theme-color" content="#0c0f14" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="웹밴드 스튜디오" />
    <meta property="og:description" content="비트와 멜로디를 만들고, 녹음하고, 음악을 배우는 브라우저 스튜디오" />
    <meta property="og:url" content="https://kimyounggaur.github.io/Garageband_copy/" />
    <meta property="og:image" content="https://kimyounggaur.github.io/Garageband_copy/og/editor-preview.png" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="840" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./icons/mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #0c0f14;
        color: #e5ecf6;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(180deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          #0c0f14;
        background-size: 32px 32px;
      }

      main {
        width: min(440px, calc(100vw - 40px));
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: rgba(17, 23, 34, 0.96);
        padding: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0;
        font-size: 22px;
      }

      p {
        margin: 10px 0 0;
        color: #9ba8ba;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        margin-top: 22px;
        height: 42px;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        background: #38bdf8;
        color: #07111c;
        padding: 0 18px;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
    <script>
      if (location.protocol === "file:" && !location.pathname.replaceAll("\\", "/").includes("/dist/")) {
        location.href = new URL("dist/index.html", location.href).href;
      }
    </script>
  </head>
  <body>
    <div id="root">
      <main>
        <h1>웹밴드 스튜디오</h1>
        <p>파일로 직접 열 때는 빌드된 화면을 사용합니다. 자동으로 이동하지 않으면 아래 버튼을 눌러주세요.</p>
        <a href="./">앱 열기</a>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
